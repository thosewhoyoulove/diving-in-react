<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">更新流程</title>
  <desc id="flowDesc">从触发更新到浏览器绘制</desc>
  <rect x="1" y="1" width="558" height="398" rx="12" fill="#fcfbf8" stroke="#e5ded4"/>
  <path d="M32 72h496" stroke="#e5ded4"/>
  <text x="32" y="44" fill="#716d66" font-family="Inter, sans-serif" font-size="12" letter-spacing="1.4">REACT UPDATE MODEL</text>
  <circle cx="506" cy="39" r="5" fill="#b9573a"/>
  <text x="32" y="118" fill="#1f1f1c" font-family="Inter, sans-serif" font-size="16" font-weight="650">四个可观察阶段</text>
  <text x="32" y="146" fill="#716d66" font-family="Inter, sans-serif" font-size="13">触发更新，经过 Render 和 Commit，再交给浏览器绘制。</text>
  <g font-family="Inter, sans-serif">
    <rect x="32" y="186" width="112" height="96" rx="8" fill="#f1e4d8" stroke="#d5cabe"/>
    <text x="48" y="218" fill="#b9573a" font-size="12" font-weight="700">01</text>
    <text x="48" y="250" fill="#1f1f1c" font-size="15" font-weight="650">触发更新</text>
    <rect x="160" y="186" width="112" height="96" rx="8" fill="#f7f5f0" stroke="#e5ded4"/>
    <text x="176" y="218" fill="#b9573a" font-size="12" font-weight="700">02</text>
    <text x="176" y="250" fill="#1f1f1c" font-size="15" font-weight="650">Render</text>
    <rect x="288" y="186" width="112" height="96" rx="8" fill="#f7f5f0" stroke="#e5ded4"/>
    <text x="304" y="218" fill="#b9573a" font-size="12" font-weight="700">03</text>
    <text x="304" y="250" fill="#1f1f1c" font-size="15" font-weight="650">Commit</text>
    <rect x="416" y="186" width="112" height="96" rx="8" fill="#211f1c"/>
    <text x="432" y="218" fill="#e28a68" font-size="12" font-weight="700">04</text>
    <text x="432" y="250" fill="#f5f1ea" font-size="15" font-weight="650">绘制</text>
  </g>
  <path d="M32 326h496" stroke="#e5ded4"/>
  <text x="32" y="358" fill="#716d66" font-family="Consolas, monospace" font-size="13">return - sibling - child</text>
  <text x="32" y="380" fill="#b9573a" font-family="Consolas, monospace" font-size="13">lane: user-blocking</text>
</svg>
